# Triage each new issue under the policy named by `triage.policy` in .winston/config.json,
# with Winston's triage script: one model call per issue, with no tools, and code that
# applies the verdict (the `risk:` tier, Priority, the plan comment, the reporter as
# assignee, and the labels the policy's "Labels triage applies" line names). There is no
# tool list, so there is nothing to deny.
#
# Installed by `winston init` as .github/workflows/triage-on-new-issue.yml. Takes effect
# only from the DEFAULT branch: `issues` and `schedule` are repository-level events, and
# GitHub runs them from the default branch alone. A copy merged anywhere else never fires
# and never errors.
#
# Runs on:
#   issues: opened      the new issue, once it is on the board with a status
#   workflow_dispatch   one issue by number, or with no number the sweep; dry_run decides
#                       and prints the verdict and writes nothing
#   schedule            a daily sweep: up to 5 open issues at the first two board statuses
#                       with no `risk:` tier, filed by the owner or a collaborator, oldest
#                       first. Delete the `schedule:` block to go without it.
# A run never re-triages an issue that already has a `risk:` tier; that is the whole-board
# /winston:triage pass's job.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   GH_PAT                   a token over this repo: Issues read/write, and Projects
#                            read/write on the board owner (the board is an org/user
#                            project, which GITHUB_TOKEN cannot reach). Fine-grained when
#                            an organization owns the board; classic (`repo`, `project`)
#                            when a user does, since fine-grained tokens cannot reach a
#                            user's projects.
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token`: the model call runs on the Claude
#                            subscription. No API key is used.
# Until both exist the run skips with a notice and stays green. `winston doctor` reports
# which are set and whether the latest runs failed; `winston init` prints the steps to
# create the missing ones. The repository variable TRIAGE_MODEL, if set, picks the model
# (default: opus).
#
# The script comes from the Winston repository at the commit pinned below, never from a
# moving branch. `winston doctor` reports when Winston has a newer pin, and
# `winston init --mode adopt` rewrites only that `ref:` line.
#
# This workflow triages. Putting a new issue on the board at its intake status is the
# board's own job: its "Auto-add to project" and "Item added to project" workflows, which
# `winston doctor` checks and only a person can turn on.
#
# When Actions is unavailable (budget, outage, a failed run) nothing is stamped and nothing
# reports itself broken: the issue stays untriaged, with no `risk:` label, which is what the
# next sweep and the next whole-board /winston:triage pass pick up.
name: Triage a new issue

on:
  issues:
    types: [opened]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to triage; empty runs the sweep"
        required: false
      dry_run:
        description: "Decide and print the verdict, write nothing"
        type: boolean
        default: false

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue || 'sweep' }}
  cancel-in-progress: false

jobs:
  triage:
    # The run holds a token that can write labels and the board, and the model reads the
    # issue body. Only new issues from people with a stake in the repo get it; others wait
    # for a manual /winston:triage pass. The sweep applies the same rule to what it takes.
    if: >-
      github.event_name != 'issues' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # No secret at job level: each step gets only what it uses, so the CLI install below
    # runs with none in its environment.
    env:
      # Through the environment, never interpolated into a script: a dispatch input is free
      # text, and `${{ }}` is substituted before the shell parses the line.
      EVENT_ISSUE: ${{ github.event.issue.number }}
      INPUT_ISSUE: ${{ inputs.issue }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check the issue number
        run: |
          case "${EVENT_ISSUE:-$INPUT_ISSUE}" in
            *[!0-9]*) echo "not an issue number: ${EVENT_ISSUE:-$INPUT_ISSUE}" >&2; exit 1 ;;
          esac
      - name: Check the secrets
        id: secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -n "$CLAUDE_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Triage skipped: this repository lacks the GH_PAT or CLAUDE_CODE_OAUTH_TOKEN secret."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          repository: sempervire/winston
          ref: 99262ea58db72d6596cb43eead9fced7ca69b0ef # winston-triage-script
          path: .winston-triage
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "24"
      # A step of its own with no secret in its environment: npm runs package install
      # scripts, and those never see either token.
      - name: Install the claude CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.325
      - name: Triage
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ISSUE="${EVENT_ISSUE:-$INPUT_ISSUE}"
          DRY=""
          if [ "${INPUT_DRY_RUN:-}" = "true" ]; then DRY="--dry-run"; fi
          # --opened waits for the board item: the board adds a new issue a moment after it is filed.
          OPENED=""
          if [ -n "$EVENT_ISSUE" ]; then OPENED="--opened"; fi
          if [ -n "$ISSUE" ]; then
            node .winston-triage/scripts/triage-issue.mjs --issue "$ISSUE" $OPENED $DRY
          else
            node .winston-triage/scripts/triage-issue.mjs --sweep --max 5 $DRY
          fi
