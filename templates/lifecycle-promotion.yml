name: Winston production promotion gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  verify-production-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: workspace/target
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sempervire/winston
          ref: 84ea15911e192388e41f3e91b0de057824cb0ce4
          path: workspace/winston
          persist-credentials: false
      - name: Check the production range
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node workspace/winston/lib/lifecycle/production.mjs gate workspace/target workspace/target/.winston/config.json "$GITHUB_EVENT_PATH"
